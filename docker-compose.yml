version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: domlux_db
      POSTGRES_USER: domlux_user
      POSTGRES_PASSWORD: domlux_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    restart: always

  web:
    build: ./backend
    # Rodando via Gunicorn para produção
    command: gunicorn domlux_core.wsgi:application --bind 0.0.0.0:8000 --workers 3
    environment:
      - POSTGRES_DB=domlux_db
      - POSTGRES_USER=domlux_user
      - POSTGRES_PASSWORD=domlux_password
      - POSTGRES_HOST=db
      - CELERY_BROKER_URL=redis://redis:6379/0
      # ATENÇÃO: Em produção real, mude os ALLOWED_HOSTS para o IP/Domínio da VPS
      - ALLOWED_HOSTS=*
      - DEBUG=False
    depends_on:
      - db
      - redis
    restart: always

  celery:
    build: ./backend
    command: celery -A domlux_core worker -l INFO
    environment:
      - POSTGRES_DB=domlux_db
      - POSTGRES_USER=domlux_user
      - POSTGRES_PASSWORD=domlux_password
      - POSTGRES_HOST=db
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
      - web
    restart: always

  frontend:
    build: ./frontend
    ports:
      - "8086:80" # <-- Mude o 8086 para a próxima porta livre na sua sequência
    depends_on:
      - web
    restart: always

volumes:
  postgres_data:
